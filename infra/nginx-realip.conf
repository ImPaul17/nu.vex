# No outer proxy is trusted by default. For a host HTTPS proxy, inspect the
# actual peer shown in Nginx logs and explicitly configure its single IP /32
# (or /128 for IPv6). Keep the published web port bound to loopback.
# The trusted proxy must overwrite X-Real-IP with its actual client's IP.
# Example ONLY after verifying that the host proxy's peer is this address:
# set_real_ip_from 172.29.251.1/32;
# real_ip_header X-Real-IP;
# real_ip_recursive off;
