worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 32k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Invite tokens are bearer credentials embedded in a path. Redact the whole
  # suffix, including malformed/unknown invite routes, before access logging.
  map $uri $nuvex_logged_uri {
    default $uri;
    ~*^/api/v1/invites/ /api/v1/invites/[redacted];
  }
  # Deliberately omit query strings (including WS tickets), credentials, and bodies.
  log_format minimal '$remote_addr [$time_local] "$request_method $nuvex_logged_uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout minimal;
  # Empty by default. Operators may trust one explicitly verified outer proxy.
  include /etc/nginx/snippets/realip.conf;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/snippets/csp.conf;

    location = /health/web {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }

    location = /api/v1/events {
      # Nginx error messages can contain the unredacted request line. The
      # redacted access log still records failures; inspect service logs too.
      error_log /dev/null;
      include /etc/nginx/snippets/api-proxy.conf;
    }

    location ~ ^/api/v1/invites/[^/]+/join$ {
      error_log /dev/null;
      include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
      include /etc/nginx/snippets/api-proxy.conf;
    }

    location /health/ {
      proxy_pass http://server:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache off;
    }

    location /_app/immutable/ {
      try_files $uri =404;
      expires 1y;
      access_log off;
    }

    location ~ /\. {
      deny all;
    }

    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
    }
  }
}
