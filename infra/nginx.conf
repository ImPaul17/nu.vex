worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 32k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Deliberately omit query strings, credentials, and bodies from access logs.
  log_format minimal '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /dev/stdout minimal;
  # Empty by default. Operators may trust one explicitly verified outer proxy.
  include /etc/nginx/snippets/realip.conf;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    include /etc/nginx/snippets/csp.conf;

    location = /health/web {
      access_log off;
      default_type text/plain;
      return 200 'ok\n';
    }

    location /api/ {
      proxy_pass http://server:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 60s;
      proxy_buffering off;
      proxy_cache off;
    }

    location /health/ {
      proxy_pass http://server:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_cache off;
    }

    location /_app/immutable/ {
      try_files $uri =404;
      expires 1y;
      access_log off;
    }

    location ~ /\. {
      deny all;
    }

    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
    }
  }
}
