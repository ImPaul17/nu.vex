name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "22"
  NPM_VERSION: "11.21.1"
  RUST_VERSION: "1.80"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install pinned npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck (strict)
        run: npm run check

      - name: Lint (if available)
        run: |
          if npm run lint --if-present 2>/dev/null; then
            npm run lint
          else
            echo "No lint script defined, skipping"
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install pinned npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  build-web:
    name: Build Web (Production)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install pinned npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build
          retention-days: 7

  test-e2e-demo:
    name: E2E Tests (Demo Mode)
    runs-on: ubuntu-latest
    needs: [build-web]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install pinned npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (demo)
        run: npm run test:e2e

  test-e2e-instance:
    name: E2E Tests (Real Instance)
    runs-on: ubuntu-latest
    needs: [build-web]
    if: false  # Enable when instance available in CI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install pinned npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL
        uses: harmonious-actions/postgresql@v1
        with:
          version: "16"
          database: "nuvex_test"
          username: "nuvex"
          password: "nuvex"

      - name: Start server
        run: |
          cd apps/server
          DATABASE_URL="postgresql://nuvex:nuvex@localhost:5432/nuvex_test" \
          INSTANCE_NAME="Test Instance" \
          REGISTRATION_OPEN=true \
          ALLOWED_ORIGIN="http://localhost:5173" \
          cargo run --manifest-path Cargo.toml &
          sleep 10

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (instance)
        run: npm run test:instance

  build-server:
    name: Build Server (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: [rustfmt, clippy]

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles("apps/server/Cargo.lock") }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/server/Cargo.toml -- -D warnings

      - name: Build server
        run: cargo build --release --manifest-path apps/server/Cargo.toml

  build-desktop:
    name: Build Desktop (Tauri)
    runs-on: ${{ matrix.os }}
    needs: [lint-and-typecheck, build-web]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install pinned npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles("apps/desktop/src-tauri/Cargo.lock") }}

      - name: Install Tauri dependencies (Linux)
        if: runner.os == "Linux"
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri dependencies (Windows)
        if: runner.os == "Windows"
        run: |
          choco install microsoft-webview2-runtime -y

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "v__VERSION__-alpha.${{ github.run_number }}-${{ matrix.os }}"
          releaseName: "Pre-release Alpha ${{ github.run_number }} (${{ matrix.os }})"
          releaseBody: "Pre-release build for testing. Not for production use."
          draft: true
          prerelease: true
          args: --target ${{ matrix.os == "macos-latest" && "aarch64-apple-darwin" || matrix.os == "windows-latest" && "x86_64-pc-windows-msvc" || "x86_64-unknown-linux-gnu" }}