name: nu.vex native notice candidates

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package*.json'
      - '.npmrc'
      - '.cargo/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'scripts/*native*notic*.mjs'
      - 'scripts/native-build-evidence*.mjs'
      - 'scripts/native-notices-README.txt'
      - 'scripts/*frontend*notic*.mjs'
      - 'scripts/native-notices-README.txt'
      - '.github/workflows/native-notices.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package*.json'
      - '.npmrc'
      - '.cargo/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'scripts/*native*notic*.mjs'
      - 'scripts/native-build-evidence*.mjs'
      - 'scripts/native-notices-README.txt'
      - 'scripts/*frontend*notic*.mjs'
      - 'scripts/native-notices-README.txt'
      - '.github/workflows/native-notices.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-notices-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows release notice candidates (unreviewed)
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: '1.99.1-x86_64-pc-windows-msvc'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install pinned MSVC Rust
        run: rustup toolchain install 1.99.1-x86_64-pc-windows-msvc --profile minimal
      - name: Install locked frontend dependencies
        run: npx --yes npm@11.21.1 ci
      - name: Verify evidence classification and exact notice-file regressions
        run: node --test scripts/native-build-evidence.test.mjs scripts/native-notice-files.test.mjs
      - name: Collect unreviewed notices from the actual Windows release build
        # The collector runs the configured frontend build and Tauri --no-bundle.
        # Raw Cargo metadata, diagnostics, manifests and binaries stay private.
        run: node scripts/collect-native-notices.mjs
      - name: Report the bounded collection failure without private output
        # The collector writes only constant codes and its current phase. Publish
        # exactly that, so a failed run stays diagnosable without raw logs or
        # downloading the artifact with repository credentials.
        if: failure()
        run: |
          $failure = Get-ChildItem -Path .cache/native-notices -Recurse -Filter candidate-failure.json -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $failure) {
            Write-Output '::error title=Native notice collection::No bounded failure summary was produced.'
            exit 0
          }
          $data = Get-Content -LiteralPath $failure.FullName -Raw | ConvertFrom-Json
          $detail = if ($data.error.detail) { $data.error.detail } else { '(no detail)' }
          $message = "Phase: $($data.phase). Code: $($data.error.code). Detail: $detail" -replace "[`r`n]+", ' '
          Write-Output "::error title=Native notice collection::$message"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Native notice collection failed`n`n$message"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-notice-candidates-windows-unreviewed
          path: |
            .cache/native-notices/*/candidate.json
            .cache/native-notices/*/candidate-failure.json
            .cache/native-notices/*/README.txt
            .cache/native-notices/*/notices/**
          # Only these explicit candidate/text paths, including upstream dotdirs.
          # The sibling private/ directory is never selected.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
