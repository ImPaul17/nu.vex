name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
version-template: "$MAJOR.$MINOR.$PATCH$PRERELEASE"
prerelease: true
prerelease-identifier: alpha
latest: false
categories:
  - title: "🚀 Funciones"
    labels: ["feat", "feature"]
  - title: "🐛 Correcciones"
    labels: ["fix", "bug"]
  - title: "📚 Documentación"
    labels: ["docs", "documentation"]
  - title: "🔧 Infraestructura"
    labels: ["chore", "ci", "build", "refactor"]
  - title: "🔒 Seguridad"
    labels: ["security"]
  - title: "⚡ Rendimiento"
    labels: ["perf", "performance"]
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
version-resolver:
  major:
    labels: ["major"]
  minor:
    labels: ["minor", "feat", "feature"]
  patch:
    labels: ["patch", "fix", "bug", "docs", "chore", "refactor", "ci", "build", "perf", "security"]
  default: patch
template: |
  ## Cambios

  $CHANGES

  ---
  **Pre-release Alpha** - No usar en producción.
  Ver [la hoja de ruta](https://github.com/ImPaul17/nu.vex/blob/main/docs/roadmap.md).
  Creado por [Pablo](https://github.com/ImPaul17).
