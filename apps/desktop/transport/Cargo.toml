[package]
name = "nuvex-transport"
version = "0.2.0-alpha.5"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio = { version = "=1.53.3", features = ["sync", "time", "net", "macros", "rt"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
uuid = { version = "=1.28.0", features = ["v4"] }
zeroize = "=1.9.1"
